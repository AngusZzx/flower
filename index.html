<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<meta property="og:title" content="宝贝，送你一朵不会凋谢的花">
<meta property="og:description" content="用无数颗光点为你点亮的一朵花，它不会凋谢。">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:#04060a;
  color:#fff;-webkit-user-select:none;user-select:none;
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,"Noto Sans SC",sans-serif}
:root{--accent:#ff758f;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}

#stage{position:fixed;inset:0;z-index:0}
#canvas{display:block;width:100%;height:100%;touch-action:none}
#error{display:none;position:fixed;inset:0;z-index:100;padding:0;background:#04060a}
.err-inner{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:40px 30px;text-align:center;font-size:14px;line-height:2.1;color:#e7d3da}
.err-heart{font-size:34px;margin-bottom:22px}
.err-t{font-size:15px;color:#fff;letter-spacing:1px;margin-bottom:18px}
.err-s{color:#9aa1ad;font-size:12.5px;letter-spacing:.5px}
.err-s b{color:#ffd6de;font-weight:600}

/* ---------- 花瓣飘落（摇曳 + 翻滚 + 层次化节奏） ---------- */
.petal{position:fixed;top:-9vh;z-index:15;pointer-events:none;
  border-radius:64% 6% 64% 6%;will-change:transform,opacity;
  animation-name:petalFall;animation-timing-function:linear;
  animation-fill-mode:forwards;box-shadow:0 0 7px rgba(255,140,170,.45)}
@keyframes petalFall{
  0%  {transform:translate3d(0,0,0) rotate(0deg) scale(.55,1);opacity:0;
       animation-timing-function:cubic-bezier(.45,0,.75,1)}
  6%  {opacity:.96;animation-timing-function:cubic-bezier(.35,.2,.7,1)}
  16% {transform:translate3d(var(--w1),15vh,0) rotate(calc(var(--rot)*.15)) scale(.35,1.06);
       animation-timing-function:cubic-bezier(.5,0,.65,1)}
  32% {transform:translate3d(var(--w2),31vh,0) rotate(calc(var(--rot)*.33)) scale(-.92,1);
       animation-timing-function:cubic-bezier(.3,.3,.75,1)}
  48% {transform:translate3d(var(--w3),48vh,0) rotate(calc(var(--rot)*.51)) scale(-.28,1.05);
       animation-timing-function:cubic-bezier(.55,0,.6,1)}
  64% {transform:translate3d(var(--w4),65vh,0) rotate(calc(var(--rot)*.69)) scale(.95,.97);
       animation-timing-function:cubic-bezier(.35,.25,.7,1)}
  80% {transform:translate3d(var(--w5),83vh,0) rotate(calc(var(--rot)*.85)) scale(.4,1.03);
       animation-timing-function:cubic-bezier(.45,.1,.75,1)}
  100%{transform:translate3d(var(--dx),118vh,0) rotate(var(--rot)) scale(-.85,.98);opacity:.04}
}

/* ---------- 顶部：配色 ---------- */
#topbar{position:fixed;left:0;right:0;top:0;z-index:20;pointer-events:none;
  padding:calc(var(--st) + 12px) 14px 12px;display:flex;align-items:center;gap:12px;
  background:linear-gradient(to bottom,rgba(4,6,10,.75),rgba(4,6,10,0));
  transition:opacity .6s ease}
#theme-name{font-size:12px;letter-spacing:.6px;color:#e6d6dc;opacity:.92;white-space:nowrap}
#palette{display:flex;gap:7px;flex:1;overflow-x:auto;padding:5px 2px;pointer-events:auto;
  scrollbar-width:none;-webkit-overflow-scrolling:touch}
#palette::-webkit-scrollbar{display:none}
.pdot{flex:0 0 auto;width:16px;height:16px;border-radius:50%;padding:0;cursor:pointer;
  border:1px solid rgba(255,255,255,.38);opacity:.58;transition:transform .25s,opacity .25s,box-shadow .25s}
.pdot.on{opacity:1;transform:scale(1.34);border-color:#fff;box-shadow:0 0 10px rgba(255,255,255,.75)}

/* ---------- 底部：花型 + 提示 ---------- */
#bottombar{position:fixed;left:0;right:0;bottom:0;z-index:20;pointer-events:none;
  text-align:center;padding:16px 18px calc(var(--sb) + 20px);
  background:linear-gradient(to top,rgba(4,6,10,.8),rgba(4,6,10,0));
  transition:opacity .6s ease}
#hint{font-size:11.5px;letter-spacing:.7px;color:#98a1ae;margin-bottom:11px}
#style-name{font-size:15px;font-weight:600;letter-spacing:1.6px;color:#fff;
  text-shadow:0 0 16px rgba(255,117,143,.75)}
#style-dots{display:flex;gap:8px;justify-content:center;margin-top:12px}
.sdot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.28);transition:all .35s}
.sdot.on{background:var(--accent);box-shadow:0 0 9px var(--accent);transform:scale(1.5)}

/* ---------- 悬浮按钮 ---------- */
#letter-btn,#petal-btn{position:fixed;right:16px;z-index:22;width:46px;height:46px;border-radius:50%;
  display:grid;place-items:center;font-size:19px;line-height:1;color:#fff;cursor:pointer;
  border:1px solid rgba(255,255,255,.2);background:rgba(18,22,30,.5);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  transition:transform .2s,opacity .6s ease}
#letter-btn{bottom:calc(var(--sb) + 200px)}
#petal-btn{bottom:calc(var(--sb) + 142px)}
#letter-btn:active,#petal-btn:active{transform:scale(.88)}

body.idle #topbar,body.idle #bottombar,body.idle #letter-btn,body.idle #petal-btn{opacity:.2}

/* ---------- 情书 ---------- */
#letter{position:fixed;inset:0;z-index:50;display:grid;place-items:center;
  padding:34px clamp(16px,5.5vw,34px);
  background:radial-gradient(120% 90% at 50% 45%,rgba(13,11,19,.9),rgba(4,6,10,.96));
  opacity:0;pointer-events:none;transition:opacity .9s ease}
#letter.show{opacity:1;pointer-events:auto}
.letter-inner{max-width:min(520px,100%);width:100%;text-align:center}
.line{font-size:clamp(13px,3.85vw,16px);line-height:2.4;
  letter-spacing:clamp(1px,.5vw,3px);font-weight:300;color:#f0e7eb;
  overflow-wrap:break-word;word-break:break-word;
  opacity:0;transform:translateY(14px);filter:blur(6px);
  transition:opacity .95s ease,transform .95s ease,filter .95s ease}
.line.in{opacity:1;transform:none;filter:blur(0)}
.l-title{font-size:clamp(22px,7vw,26px);letter-spacing:clamp(5px,2.5vw,10px);
  text-indent:clamp(5px,2.5vw,10px);color:#fff;margin-bottom:16px;
  text-shadow:0 0 26px rgba(255,140,170,.65)}
.l-sign{font-size:clamp(11.5px,3.2vw,13px);color:#a99fb0;letter-spacing:2px;margin-top:22px}
.letter-tip{font-size:11px;color:#6f6878;letter-spacing:2px;margin-top:32px;opacity:0;
  animation:fadeIn 1.2s ease 3.4s forwards}
@keyframes fadeIn{to{opacity:1}}

/* ---------- 开场 ---------- */
#intro{position:fixed;inset:0;z-index:60;display:grid;place-items:center;cursor:pointer;
  background:radial-gradient(120% 90% at 50% 42%,#171020 0%,#080a10 55%,#04060a 100%);
  transition:opacity 1.25s ease,transform 1.25s ease}
#intro.gone{opacity:0;transform:scale(1.06);pointer-events:none}
.intro-inner{position:relative;text-align:center;padding:0 30px}
.intro-glow{position:absolute;left:50%;top:4%;width:280px;height:280px;transform:translate(-50%,-4%);
  background:radial-gradient(circle,rgba(255,117,143,.34),rgba(255,117,143,0) 66%);
  filter:blur(14px);animation:breathe 4.2s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.5;transform:translate(-50%,-4%) scale(1)}
  50%{opacity:1;transform:translate(-50%,-4%) scale(1.16)}}
.intro-heart{position:relative;font-size:34px;color:#ff8fa3;
  text-shadow:0 0 28px rgba(255,117,143,.95);animation:beat 1.9s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}18%{transform:scale(1.22)}36%{transform:scale(1)}54%{transform:scale(1.14)}}
#intro h1{position:relative;font-size:34px;font-weight:300;letter-spacing:12px;text-indent:12px;
  margin:24px 0 16px;color:#fff;text-shadow:0 0 30px rgba(255,150,175,.6)}
#intro p{position:relative;font-size:14px;font-weight:300;letter-spacing:2.6px;color:#cbc4d2}
.intro-btn{position:relative;display:inline-block;margin-top:42px;padding:13px 36px;border-radius:999px;
  font-size:14px;letter-spacing:4px;text-indent:4px;color:#ffd6de;
  border:1px solid rgba(255,143,163,.55);background:rgba(255,117,143,.1);
  animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,117,143,.45)}70%{box-shadow:0 0 0 20px rgba(255,117,143,0)}}
</style>
</head>

      let a = j * TAU / 15 + 0.28, seed = rand() * 100;
      for (let k = 0; k < 2400; k++) {
        let u = rand() * 2 - 1, v = Math.sqrt(rand());
        let r = 0.13 + 0.99 * Math.sin(v * 1.5), ang = a + u * 0.15 * Math.sin(Math.PI * v);
        let y = -0.78 + 0.69 * v + 0.09 * Math.sin(v * 4 + u * 3 + j);
        let p = [r * Math.sin(ang), y, r * Math.cos(ang)].map(x => x + gaussian() * 0.026);
        let c = lerpc([0.24, 0.27, 0.13], [0.79, 0.76, 0.55], smooth(0.25, 1, v));
        c = lerpc(c, [0.88, 0.79, 0.65], smooth(0.75, 1, Math.abs(u)) * 0.5);
        vertex(particles, p, c, 0.13, 0.95 + rand() * 0.6, 1.1, seed + rand());
      }
    }

    for (let j = 0; j < 25; j++) {
      let a = j * TAU / 25, seed = rand() * 100;
      for (let k = 0; k < 520; k++) {
        let v = rand(), r = 0.035 + 0.16 * Math.pow(1 - v, 2) + 0.08 * smooth(0.70, 1, v);
        let p = [r * Math.sin(a + 0.55 * v) + gaussian() * 0.014, -1.56 + 0.94 * v, r * Math.cos(a + 0.55 * v) + gaussian() * 0.014];
        let c = lerpc([0.57, 0.07, 0.12], [0.37, 0.28, 0.15], smooth(0.55, 1, v));
        vertex(particles, p, c, 0.32, 0.90 + rand() * 0.45, 1.4, seed + rand() * 3);
      }
    }

    for (let side of [-1, 1]) {
      for (let k = 0; k < 7800; k++) {
        const t = rand(), w = rand() * 2 - 1;
        let p = ribbonPoint(side, t, w).map(x => x + gaussian() * 0.009);
        let c = lerpc([0.97, 0.88, 0.82], [1, 0.66, 0.72], 0.18 + 0.14 * Math.sin(t * TAU));
        vertex(particles, p, c, 0.41, 1.05, 1.4, 0);
      }
    }
  }

  for (let k = 0; k < 25000; k++) {
    let a = rand() * TAU, v = rand(), y = -0.55 + 0.75 * v;
    let r = 1.05 * Math.sqrt(Math.max(0.01, 1 - Math.pow((y - 0.35) / 1.10, 2)));
    let p = [r * Math.sin(a) + gaussian() * 0.04, y + gaussian() * 0.05, r * Math.cos(a) + gaussian() * 0.04];
    let c = lerpc([0.25, 0.25, 0.15], [0.82, 0.77, 0.62], smooth(0.2, 0.95, v));
    c = lerpc(c, ivory, 0.25 * rand());
    vertex(particles, p, c, 0.22, 1.1 + rand() * 0.4, 1.5, 0);
  }

  return { particles, threads };
}

function shader(type, source) {
  const s = gl.createShader(type);
  gl.shaderSource(s, source);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw Error(gl.getShaderInfoLog(s));
  return s;
}
function program(v, f) {
  const p = gl.createProgram();
  gl.attachShader(p, shader(gl.VERTEX_SHADER, v));
  gl.attachShader(p, shader(gl.FRAGMENT_SHADER, f));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw Error(gl.getProgramInfoLog(p));
  return p;
}

const vertexShader = `#version 300 es
precision highp float;
layout(location=0) in vec3 aPosition;
layout(location=1) in vec3 aColour;
layout(location=2) in vec4 aData;

uniform float uTime, uYaw, uPitch, uDistance, uAspect, uScale, uFlow, uPeriod, uXOffset, uBurst, uOpacity;
uniform int uBox;
uniform vec3 uThemeCore, uThemeMid, uThemeRim, uThemeSepal, uThemeRibbon, uThemeBox;

out vec3 vColour; out float vOpacity;

vec3 drift(vec3 p, float t) {
  vec3 q = p * 5.2;
  vec3 f = vec3(sin(q.y * 1.14 + q.z * 0.74 + t * 2.0), sin(q.z * 1.12 + q.x * 0.70 - t * 2.0), sin(q.x * 1.22 - q.y * 0.76 + t * 3.0));
  vec3 s = vec3(sin(q.y * 2.75 + f.z * 1.6 - t * 4.0), cos(q.z * 2.54 + f.x * 1.5 + t * 3.0), sin(q.x * 2.82 + f.y * 1.7 + t * 4.0));
  return f * 0.039 + s * 0.023;
}

vec3 getThemeColor(vec3 base) {
  if (base.g > base.r * 1.05 && base.g > 0.15) {
    float lum = dot(base, vec3(0.299, 0.587, 0.114));
    return mix(uThemeSepal * 0.5, uThemeSepal * 1.35, smoothstep(0.1, 0.65, lum));
  }
  float minC = min(base.r, min(base.g, base.b));
  float maxC = max(base.r, max(base.g, base.b));
  if (minC > 0.55 && (maxC - minC) < 0.28) {
    float lum = dot(base, vec3(0.333));
    return mix(uThemeRibbon * 0.85, vec3(1.0, 0.98, 0.95), smoothstep(0.7, 1.0, lum));
  }
  if (base.r > base.g * 1.4 && base.r < 0.62 && base.b < 0.22) {
    return mix(uThemeCore * 0.7, uThemeCore * 1.2, base.r);
  }
  float lum = dot(base, vec3(0.299, 0.587, 0.114));
  float rim = smoothstep(0.64, 0.93, max(base.b * 1.6, lum));
  vec3 col = mix(uThemeCore, uThemeMid, smoothstep(0.10, 0.56, lum));
  col = mix(col, uThemeRim, rim);
  return col;
}

void main() {
  vec3 p = aPosition;
  if (uBox == 0) {
    float t = uTime * 6.28318530718 / uPeriod;
    p += drift(p, t) * aData.z * uFlow;
    p += vec3(sin(t * 5.0 + aData.w), cos(t * 4.0 + aData.w * 1.3), sin(t * 6.0 + aData.w * 0.8)) * 0.004 * aData.z * uFlow;
    p.xz *= 1.0 + 0.006 * sin(t * 3.0 + p.y * 2.0);
  }
  if (uBox == 0 && uBurst > 0.0001) {
    vec3 bdir = normalize(p + vec3(0.0007, 0.0004, 0.0007));
    float bamp = uBurst * (0.25 + 1.05 * fract(aData.w * 0.6180339887));
    p += bdir * bamp;
    p.y += uBurst * 0.30 * (fract(aData.w * 0.3819660113) - 0.35);
  }
  float cy = cos(uYaw), sy = sin(uYaw);
  p = vec3(cy * p.x + sy * p.z, p.y, -sy * p.x + cy * p.z);
  float cp = cos(uPitch), sp = sin(uPitch);
  p = vec3(p.x, cp * p.y - sp * p.z, sp * p.y + cp * p.z);
  p.y += 0.035;
  p.x += uXOffset;

  float z = uDistance - p.z;
  float f = 3.35;
  gl_Position = vec4(p.x * f / uAspect, p.y * f, ((100.1 / 99.9) * z - (20.0 / 99.9)), z);
  gl_PointSize = clamp(aData.y * uScale * 11.4 / z, 0.7, 4.6 * uScale);
  float light = 0.82 + 0.18 * smoothstep(-1.2, 1.2, p.z);

  vec3 baseColor = uBox == 1 ? uThemeBox : getThemeColor(aColour);
  vColour = baseColor * (uBox == 1 ? 1.0 : light);
  vOpacity = aData.x * uOpacity * (uBox == 1 ? 1.0 : (0.42 + 0.58 * smoothstep(-1.1, 1.1, p.z)));
}`;

const pointFragment = `#version 300 es
precision highp float;
in vec3 vColour; in float vOpacity;
out vec4 frag;
void main() {
  vec2 uv = (gl_PointCoord - 0.5) * 2.0;
  float r = dot(uv, uv);
  if (r > 1.0) discard;
  float a = exp(-r * 2.6) * (1.0 - smoothstep(0.72, 1.0, r));
  frag = vec4(vColour, a * vOpacity);
}`;

const lineFragment = `#version 300 es
precision highp float;
in vec3 vColour; in float vOpacity;
out vec4 frag;
void main() { frag = vec4(vColour, vOpacity); }`;

const pointsProgram = program(vertexShader, pointFragment);
const linesProgram = program(vertexShader, lineFragment);

function upload(vertices, existingVao = null, existingBuffer = null) {
  const vao = existingVao || gl.createVertexArray();
  gl.bindVertexArray(vao);
  const buffer = existingBuffer || gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(vertices), gl.STATIC_DRAW);
  for (let [loc, num, offset] of [[0, 3, 0], [1, 3, 12], [2, 4, 24]]) {
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, num, gl.FLOAT, false, 40, offset);
  }
  return { vao, buffer, count: vertices.length / 10 };
}

let sceneGeo = generateSceneGeometry('bouquet');
let pointGeometry = upload(sceneGeo.particles);
let threadGeometry = upload(sceneGeo.threads);

const cage = [], cageDots = [];
const d = 1.52, low = -1.63, high = 1.75;
const corners = [
  [-d, low, -d], [d, low, -d], [d, low, d], [-d, low, d],
  [-d, high, -d], [d, high, -d], [d, high, d], [-d, high, d]
];
for (let [i, j] of [[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]]) {
  vertex(cage, corners[i], [0.65, 0.78, 0.92], 0.52, 1, 0, 0);
  vertex(cage, corners[j], [0.65, 0.78, 0.92], 0.52, 1, 0, 0);
}
for (let pt of corners) {
  vertex(cageDots, pt, [1, 1, 1], 0.95, 3.2, 0, 0);
}
const boxGeometry = upload(cage);
const boxDotsGeometry = upload(cageDots);

const quadVertex = `#version 300 es
precision highp float;
out vec2 uv;
void main() {
  vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));
  uv = p;
  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
}`;

const blurFragment = `#version 300 es
precision highp float;
in vec2 uv;
uniform sampler2D image;
uniform vec2 stepUV;
uniform int firstPass;
out vec4 frag;
vec3 sampleAt(vec2 p) {
  vec3 c = texture(image, p).rgb;
  return firstPass == 1 ? max(c - 0.17, vec3(0.0)) : c;
}
void main() {
  vec3 c = sampleAt(uv) * 0.227027;
  c += sampleAt(uv + stepUV * 1.384615) * 0.316216;
  c += sampleAt(uv - stepUV * 1.384615) * 0.316216;
  c += sampleAt(uv + stepUV * 3.230769) * 0.070270;
  c += sampleAt(uv - stepUV * 3.230769) * 0.070270;
  frag = vec4(c, 1.0);
}`;

const finalFragment = `#version 300 es
precision highp float;
in vec2 uv;
uniform sampler2D scene, glow;
uniform float bloom, exposure;
out vec4 frag;
void main() {
  vec3 a = texture(scene, uv).rgb;
  vec3 b = texture(glow, uv).rgb;
  vec3 c = (a + b * bloom * 0.86) * exposure;
  vec2 v = (uv - 0.5) * vec2(1.33, 1.0);
  float vign = 1.0 - 0.15 * dot(v, v);
  c = vec3(1.0) - exp(-c * 1.18);
  c = pow(max(c, vec3(0.0)), vec3(0.83)) * vign;
  frag = vec4(clamp(c, 0.0, 1.0), 1.0);
}`;

const blurProgram = program(quadVertex, blurFragment);
const finalProgram = program(quadVertex, finalFragment);
const quadVAO = gl.createVertexArray();

const uniforms = new Map();
function loc(p, k) {
  let m = uniforms.get(p);
  if (!m) { m = {}; uniforms.set(p, m); }
  if (!(k in m)) m[k] = gl.getUniformLocation(p, k);
  return m[k];
}
function uniform(p, k, v) { gl.uniform1f(loc(p, k), v); }

function target(w, h) {
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, HDR ? gl.RGBA16F : gl.RGBA8, w, h, 0, gl.RGBA, HDR ? gl.HALF_FLOAT : gl.UNSIGNED_BYTE, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  const fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  if (gl.checkFramebufferStatus(gl.FRAMEBUFFER) !== gl.FRAMEBUFFER_COMPLETE) throw Error('Framebuffer unavailable');
  return { tex, fbo, w, h };
}

let sceneRT, blurA, blurB;
function resize(w, h) {
  const clientW = canvas.clientWidth || window.innerWidth || 1024;
  const clientH = canvas.clientHeight || window.innerHeight || 768;
  const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
  w = Math.round(w || Math.min(1920, Math.max(64, clientW * dpr)));
  h = Math.round(h || Math.max(48, clientH * dpr));
  if (canvas.width === w && canvas.height === h && sceneRT) return;
  canvas.width = w; canvas.height = h;
  for (const rt of [sceneRT, blurA, blurB]) {
    if (rt) { gl.deleteTexture(rt.tex); gl.deleteFramebuffer(rt.fbo); }
  }
  sceneRT = target(w, h);
  blurA = target(Math.ceil(w / 2), Math.ceil(h / 2));
  blurB = target(blurA.w, blurA.h);
}

function geometry(p, g, mode, t, isBox, op = 1) {
  gl.useProgram(p);
  gl.bindVertexArray(g.vao);
  const angle = (PARAMS.spin ? t * TAU / PARAMS.duration : 0) + PARAMS.manualYaw + 0.25;
  const isWidescreen = window.innerWidth >= 1200 && window.innerHeight >= 560;
  const xOffset = PARAMS.codeVisible && isWidescreen ? 0.70 : 0.0;

  const isLandscapePhone = window.innerHeight <= 560 && (window.innerWidth / window.innerHeight) > 1.25;
  const isMobilePortrait = window.innerWidth <= 560;
  let adaptedDist = PARAMS.cameraDistance;
  if (isLandscapePhone) {
    adaptedDist *= 1.35;
  } else if (isMobilePortrait) {
    adaptedDist *= 1.08;
  }

  const aspect = canvas.width / canvas.height;
  const baseScale = Math.max(canvas.height, Math.min(canvas.width, 1080)) / 768;

  uniform(p, 'uTime', t);
  uniform(p, 'uPeriod', PARAMS.duration);
  uniform(p, 'uYaw', angle);
  uniform(p, 'uPitch', PARAMS.cameraPitch + PARAMS.manualPitch);
  uniform(p, 'uDistance', adaptedDist);
  uniform(p, 'uAspect', aspect);
  uniform(p, 'uScale', Math.max(0.85, baseScale));
  uniform(p, 'uFlow', PARAMS.flow);
  uniform(p, 'uXOffset', xOffset);
  uniform(p, 'uBurst', burstLevel);
  uniform(p, 'uOpacity', op);
  gl.uniform1i(loc(p, 'uBox'), isBox ? 1 : 0);

  gl.uniform3fv(loc(p, 'uThemeCore'), curColors.core);
  gl.uniform3fv(loc(p, 'uThemeMid'), curColors.mid);
  gl.uniform3fv(loc(p, 'uThemeRim'), curColors.rim);
  gl.uniform3fv(loc(p, 'uThemeSepal'), curColors.sepal);
  gl.uniform3fv(loc(p, 'uThemeRibbon'), curColors.ribbon);
  gl.uniform3fv(loc(p, 'uThemeBox'), curColors.box);

  gl.drawArrays(mode, 0, g.count);
}

function blur(from, to, dx, dy, first) {
  gl.bindFramebuffer(gl.FRAMEBUFFER, to.fbo);
  gl.viewport(0, 0, to.w, to.h);
  gl.useProgram(blurProgram);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, from.tex);
  gl.uniform1i(loc(blurProgram, 'image'), 0);
  gl.uniform2f(loc(blurProgram, 'stepUV'), dx, dy);
  gl.uniform1i(loc(blurProgram, 'firstPass'), first);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

function renderAt(t) {
  updateThemeColors();

  gl.bindFramebuffer(gl.FRAMEBUFFER, sceneRT.fbo);
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.disable(gl.DEPTH_TEST);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
  gl.clearColor(0.003, 0.005, 0.004, 1);
  gl.clear(gl.COLOR_BUFFER_BIT);

  if (PARAMS.box) {
    geometry(linesProgram, boxGeometry, gl.LINES, t, true);
    geometry(pointsProgram, boxDotsGeometry, gl.POINTS, t, true);
  }
  if (flowerOpacity > 0.002) {
    geometry(pointsProgram, pointGeometry, gl.POINTS, t, false, flowerOpacity);
    geometry(linesProgram, threadGeometry, gl.LINES, t, false, flowerOpacity);
  }
  if (budGeometry && budOpacity > 0.002) {
    geometry(pointsProgram, budGeometry, gl.POINTS, t, false, budOpacity);
  }

  gl.disable(gl.BLEND);
  gl.bindVertexArray(quadVAO);
  blur(sceneRT, blurA, 1.5 / sceneRT.w, 0, 1);
  blur(blurA, blurB, 0, 1.7 / blurA.h, 0);
  blur(blurB, blurA, 2.1 / blurB.w, 0, 0);
  blur(blurA, blurB, 0, 2.1 / blurA.h, 0);

  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.useProgram(finalProgram);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, sceneRT.tex);
  gl.uniform1i(loc(finalProgram, 'scene'), 0);
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, blurB.tex);
  gl.uniform1i(loc(finalProgram, 'glow'), 1);
  uniform(finalProgram, 'bloom', PARAMS.bloom);
  uniform(finalProgram, 'exposure', PARAMS.exposure);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

let running = true, clock = 0, last = performance.now(), raf = 0;
function tick(now) {
  let dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  if (!PARAMS.paused) clock += dt * PARAMS.speed;
  if (burstLevel > 0.0006) {
    burstLevel *= Math.pow(0.0009, dt);
    if (burstLevel < 0.0006) burstLevel = 0;
  }
  updateBloomAnim(dt);
  renderAt(clock);
  if (running) raf = requestAnimationFrame(tick);
}

resize();
renderAt(0);
if (running) raf = requestAnimationFrame(tick);

window.addEventListener('resize', () => resize());

// ==================== 6. Mobile Surprise Interaction Layer ====================
// 说明：以下仅新增交互，不修改任何花型/配色/几何/着色器逻辑。
const $ = id => document.getElementById(id);
const STYLE_KEYS = Object.keys(STYLES);
const THEME_KEYS = Object.keys(THEMES);
let introDone = false;

/* ---------- 花型切换（复用原生成器，几何与原版完全一致） ---------- */
function applyStyle(key) {
  if (!STYLES[key]) return;
  currentStyleKey = key;
  PARAMS.cameraPitch = STYLES[key].pitch;
  PARAMS.cameraDistance = STYLES[key].dist;
  PARAMS.manualPitch = 0;
  const g = generateSceneGeometry(key);
  upload(g.particles, pointGeometry.vao, pointGeometry.buffer);
  pointGeometry.count = g.particles.length / 10;
  upload(g.threads, threadGeometry.vao, threadGeometry.buffer);
  threadGeometry.count = g.threads.length / 10;
}

function updateStyleUI() {
  const s = STYLES[currentStyleKey];
  $('style-name').textContent = s.icon + ' ' + s.name;
  document.querySelectorAll('.sdot').forEach((d, i) =>
    d.classList.toggle('on', STYLE_KEYS[i] === currentStyleKey));
}

function changeStyle(dir) {
  const i = STYLE_KEYS.indexOf(currentStyleKey);
  applyStyle(STYLE_KEYS[(i + dir + STYLE_KEYS.length) % STYLE_KEYS.length]);
  burstLevel = Math.max(burstLevel, 0.8);   // 换花时也来一次粒子聚合，衔接更顺
  updateStyleUI();
  wakeUI();
}

/* ---------- 配色切换 ---------- */
function updateThemeUI() {
  const t = THEMES[currentThemeKey];
  $('theme-name').textContent = t.icon + ' ' + t.name;
  document.documentElement.style.setProperty('--accent', t.dot);
  document.querySelectorAll('.pdot').forEach((d, i) =>
    d.classList.toggle('on', THEME_KEYS[i] === currentThemeKey));

THEME_KEYS.forEach(k => {
  const b = document.createElement('button');

  $('palette').appendChild(b);

STYLE_KEYS.forEach(() => {

/* ---------- 花瓣飘落 ---------- */
function spawnPetals(n) {
  const theme = THEMES[currentThemeKey];
  for (let i = 0; i < n; i++) {
    const p = document.createElement('div');
    p.className = 'petal';

    // 尺寸形态：小瓣轻飘、大瓣稳重
    const w = 7 + Math.random() * 13;
    p.style.width = w.toFixed(1) + 'px';
    p.style.height = (w * (1.02 + Math.random() * 0.16)).toFixed(1) + 'px';

    // 起点铺满整幅宽度，避免"排成一条线"落下
    p.style.left = (Math.random() * 104 - 2).toFixed(1) + 'vw';

    // 摇曳轨迹：左右交替摆幅（用 vw 保证不同屏宽观感一致）
    const amp = 3 + Math.random() * 10;
    const dir = Math.random() < 0.5 ? -1 : 1;
    [0.50, -0.85, 1.05, -0.72, 0.42].forEach((f, k) =>
      p.style.setProperty('--w' + (k + 1), (dir * amp * f).toFixed(2) + 'vw'));
    p.style.setProperty('--dx', (dir * amp * 0.75).toFixed(2) + 'vw');

    // 翻滚：随机圈数 + 随机方向
    const spin = (1.2 + Math.random() * 2.6) * (Math.random() < 0.5 ? -1 : 1);
    p.style.setProperty('--rot', (spin * 360).toFixed(0) + 'deg');

    // 时长与延迟拉开层次，避免齐刷刷同时落地
    p.style.animationDuration = (5.0 + Math.random() * 4.6).toFixed(2) + 's';
    p.style.animationDelay = (Math.random() * 1.4).toFixed(2) + 's';

    // 花色微差：约三成偏白，避免一片死板的同色
    const fill = Math.random() > 0.72 ? 'rgba(255,255,255,.92)' : theme.dot;
    p.style.background = 'radial-gradient(circle at 32% 28%, rgba(255,255,255,.95), rgba(255,255,255,0) 62%), ' + fill;

    document.body.appendChild(p);
    setTimeout(() => { if (p.parentNode) p.remove(); }, 12500);
  }
}
setInterval(() => { if (introDone && !document.hidden) spawnPetals(3); }, 9000);

/* ---------- 摇一摇 → 花瓣飘落 ---------- */
let motionBound = false, lastShake = 0;
function onShake(e) {
  const a = e.accelerationIncludingGravity;
  if (!a || a.x == null) return;
  const mag = Math.hypot(a.x, a.y, a.z);
  const now = performance.now();
  if (mag > 17.5 && now - lastShake > 1100) {
    lastShake = now;
    spawnPetals(26);
    wakeUI();
  }
}
function enableMotion() {
  if (motionBound) return;
  motionBound = true;
  const D = window.DeviceMotionEvent;
  if (typeof D !== 'undefined' && typeof D.requestPermission === 'function') {
    // iOS 13+ 必须在用户手势中申请授权
    D.requestPermission().then(r => {
      if (r === 'granted') window.addEventListener('devicemotion', onShake);
    }).catch(() => {});
  } else if (typeof D !== 'undefined') {
    window.addEventListener('devicemotion', onShake);
  }
}

/* ---------- 触摸 / 鼠标统一交互 ---------- */
const pts = new Map();
let startPt = null, startT = 0, maxMove = 0, pinch0 = 0, camDist0 = 0;

canvas.addEventListener('pointerdown', e => {
  if (!introDone) return;
  wakeUI();
  try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
  pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pts.size === 1) {
    startPt = { x: e.clientX, y: e.clientY };
    startT = performance.now();
    maxMove = 0;
  } else if (pts.size === 2) {
    startPt = null;
    const v = [...pts.values()];
    pinch0 = Math.hypot(v[0].x - v[1].x, v[0].y - v[1].y);
    camDist0 = PARAMS.cameraDistance;
  }
});

canvas.addEventListener('pointermove', e => {
  if (!pts.has(e.pointerId)) return;
  const prev = pts.get(e.pointerId);
  pts.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if (pts.size === 2 && pinch0) {                       // 双指缩放视距
    const v = [...pts.values()];
    const dist = Math.hypot(v[0].x - v[1].x, v[0].y - v[1].y);
    PARAMS.cameraDistance = clamp(camDist0 * (pinch0 / Math.max(1, dist)), 4.2, 13.5);
    return;
  }
  if (pts.size === 1 && startPt) {                      // 单指：横向旋转 / 纵向俯仰
    maxMove = Math.max(maxMove, Math.hypot(e.clientX - startPt.x, e.clientY - startPt.y));
    PARAMS.manualYaw += (e.clientX - prev.x) * 0.0055;
    PARAMS.manualPitch = clamp(PARAMS.manualPitch + (e.clientY - prev.y) * 0.0032, -0.6, 0.6);
  }
});

function endPointer(e) {
  if (!pts.has(e.pointerId)) return;
  pts.delete(e.pointerId);
  if (pts.size < 2) pinch0 = 0;
  if (pts.size === 0 && startPt) {
    const dx = e.clientX - startPt.x, dy = e.clientY - startPt.y;
    const dt = performance.now() - startT;
    const isTap = maxMove < 15 && dt < 450;                       // 轻点 → 花苞绽放
    const isSwipe = Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.15;  // 横滑 → 换花
    if (isTap) {
      triggerBloom();
    } else if (isSwipe && bloomState !== 'bursting' && bloomState !== 'closing') {   // 动画中不换花型
      changeStyle(dx < 0 ? 1 : -1);
    }
    startPt = null;
  }
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);

canvas.addEventListener('wheel', e => {                 // 桌面滚轮缩放
  e.preventDefault();
  PARAMS.cameraDistance = clamp(PARAMS.cameraDistance + e.deltaY * 0.003, 4.2, 13.5);
}, { passive: false });

/* ---------- 花苞几何（独立生成，绝不触碰原花型代码） ---------- */
function generateBudGeometry() {
  const particles = [];
  const savedRng = rng;
  rng = 20241013;                          // 独立随机种子

  const BASE = -0.58, TIP = 1.26, H = TIP - BASE;
  const RMAX = 0.375;
  // 水滴形轮廓：底部收窄 → 中段饱满 → 顶部收尖
  const profile = s => {
    s = clamp(s, 0.0005, 0.9995);
    return RMAX * Math.pow(s, 0.34) * Math.pow(1 - s, 0.72) / 0.5144;
  };
  const pb = { phase: 0.9 };

  // 1) 抱合的花瓣：按「曲面」采样；层间错角 + 位置抖动，避免出现规则条纹
  const LAYERS = 5;
  const petalsPer = [6, 7, 8, 9, 10];
  const NU = 32, NV = 32;
  for (let L = 0; L < LAYERS; L++) {
    const t = L / (LAYERS - 1);                       // 0 = 最外层, 1 = 最内层
    const np = petalsPer[L];
    const s0 = 0.02 + 0.46 * Math.pow(t, 1.35);
    const s1 = 0.985 - 0.05 * t;
    const rScale = 1 - 0.46 * Math.pow(t, 1.10);
    const dth = (TAU / np) * 0.68;                    // 半宽 > 半间距 → 相邻重叠无缝隙
    const layerIdx = Math.min(4, Math.round(t * 4));
    for (let k = 0; k < np; k++) {
      const ac = k * TAU / np + L * 1.25 + 0.3;
      for (let i = 0; i < NU; i++) {
        const u = i / (NU - 1);
        const s = s0 + (s1 - s0) * u;
        const prof = profile(s) * rScale;
        for (let jj = 0; jj < NV; jj++) {
          const v = (jj / (NV - 1)) * 2 - 1;          // -1 .. 1，花瓣横向位置
          // —— 位置抖动：打散「一圈一圈」的规则感 ——
          const js = s + (rand() - 0.5) * 0.010;
          const ja = ac + dth * v + 0.16 * u + (rand() - 0.5) * 0.055;
          const jr = 1 + (rand() - 0.5) * 0.030;
          const rr = profile(clamp(js, 0.0005, 0.9995)) * rScale
                     * (1 - 0.30 * v * v) * jr;
          let col = petalColour(layerIdx, k, clamp(v * 1.15, -1, 1),
                                Math.min(1, s * 0.96), pb);
          if (s > 0.80) col = lerpc(col, [0.30, 0.045, 0.075], smooth(0.80, 1, s) * 0.62);
          vertex(particles,
                 [Math.cos(ja) * rr, BASE + H * js, Math.sin(ja) * rr],
                 col, 0.68 + 0.22 * Math.sin(u * 3.0 + k * 1.7),
                 1.0 + 0.5 * (1 - s), 1.0,
                 (L * 0.21 + k * 0.13 + u) % 1);
        }
      }
    }
  }

  // 2) 花萼：5 片绿色萼片，从茎基部向上「抱合」花苞下段（绿色会被识别为叶片）
  for (let k = 0; k < 5; k++) {
    const a0 = k * TAU / 5 + 0.3;
    for (let i = 0; i < 700; i++) {
      const u = i / 699;
      const y = BASE - 0.28 + 0.72 * u;               // 从茎基部 → 花苞下段
      const sb = clamp((y - BASE) / H, 0.0005, 0.9995);
      const flare = 1.12 + 0.24 * Math.pow(u, 3);     // 尖端微微外翻
      const r = profile(sb) * flare + 0.05;
      const ang = a0 + 0.26 * Math.sin(u * 2.4) + (rand() - 0.5) * 0.05;
      const col = lerpc([0.20, 0.42, 0.16], [0.55, 0.86, 0.38], 0.30 + 0.70 * u);
      vertex(particles, [Math.cos(ang) * r, y, Math.sin(ang) * r],
             col, 0.88, 1.0, 1.0, 0.5 + u * 0.4);
    }
  }

  // 3) 花茎
  for (let i = 0; i < 460; i++) {
    const u = i / 459;
    const y = BASE - 0.28 - 0.66 * u;
    const r = 0.040 * (1 - 0.42 * u);
    const ang = u * 9.0;
    const col = lerpc([0.16, 0.34, 0.13], [0.42, 0.68, 0.30], u);
    vertex(particles, [Math.cos(ang) * r, y, Math.sin(ang) * r],
           col, 0.85, 0.95, 1.0, u * 0.6);
  }

  rng = savedRng;
  return upload(particles);
}

/* ---------- 花苞 → 炸开 → 盛开 状态机 ---------- */
function updateHint() {
  const el = $('hint');
  if (!el) return;
  el.textContent = (bloomState === 'bloomed' || bloomState === 'bursting')
    ? '轻点收回花苞 · 左右滑动换花 · 摇一摇撒花瓣'
    : '👆 轻点花苞，让它为你开花';
}

function startBurst() {
  bloomState = 'bursting';
  bloomT = 0;
  burstLevel = 1.45;                    // 花苞粒子向外炸开
  updateHint();
}

function triggerBloom() {
  if (bloomState === 'bursting' || bloomState === 'closing') return;   // 动画中防抖
  if (bloomState === 'bud') {
    startBurst();                       // 花苞 → 炸开 → 盛开
  } else if (bloomState === 'bloomed') {
    bloomState = 'closing';             // 盛开 → 收回花苞（停在花苞，不自动重放）
    bloomT = 0;
    burstLevel = Math.max(burstLevel, 0.45);   // 花瓣轻轻一散，收回更自然
    updateHint();
  }
}

function updateBloomAnim(dt) {
  if (bloomState === 'bursting') {
    bloomT += dt;
    const k = clamp(bloomT / 0.62);
    budOpacity = Math.max(0, 1 - k * 1.85);          // 花苞粒子迅速散去
    flowerOpacity = clamp((k - 0.12) / 0.70);        // 花朵随之聚合浮现
    if (k >= 1) { bloomState = 'bloomed'; budOpacity = 0; flowerOpacity = 1; updateHint(); }
  } else if (bloomState === 'closing') {
    bloomT += dt;
    const k = clamp(bloomT / 0.42);
    budOpacity = k;                                  // 花朵收回成花苞
    flowerOpacity = 1 - k;
    if (k >= 1) { bloomState = 'bud'; budOpacity = 1; flowerOpacity = 0; updateHint(); }
  }
}

/* ---------- 开场 & 情书 ---------- */
const letterTimers = [];
function showLetter() {
  const el = $('letter');
  el.classList.add('show');
  const ls = el.querySelectorAll('.line');
  ls.forEach((l, i) => letterTimers.push(setTimeout(() => l.classList.add('in'), 430 * i)));
  letterTimers.push(setTimeout(hideLetter, 430 * ls.length + 4200));
}
function hideLetter() {
  letterTimers.forEach(clearTimeout);
  letterTimers.length = 0;
  const el = $('letter');
  el.classList.remove('show');
  el.querySelectorAll('.line').forEach(l => l.classList.remove('in'));
}
$('letter').addEventListener('click', hideLetter);

function enterExperience() {
  if (introDone) return;
  introDone = true;
  burstLevel = 1.45;                     // 漫天星点聚合成「花苞」，等待她轻点绽放
  const intro = $('intro');
  intro.classList.add('gone');
  setTimeout(() => { if (intro.parentNode) intro.remove(); }, 1400);
  setTimeout(showLetter, 1150);
  enableMotion();                        // iOS 需在用户手势内申请重力感应权限
  updateStyleUI();
  wakeUI();
}
$('intro').addEventListener('click', enterExperience);

$('letter-btn').addEventListener('click', e => { e.stopPropagation(); showLetter(); wakeUI(); });
$('petal-btn').addEventListener('click', e => { e.stopPropagation(); spawnPetals(30); wakeUI(); });

/* ---------- 桌面端快捷键（方便预览调试） ---------- */
window.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); PARAMS.paused = !PARAMS.paused; }
  if (e.key === 'c' || e.key === 'C') {
    currentThemeKey = THEME_KEYS[(THEME_KEYS.indexOf(currentThemeKey) + 1) % THEME_KEYS.length];
    updateThemeUI();
  }
  if (e.key === 'v' || e.key === 'V') changeStyle(1);
  if (e.key === 'p' || e.key === 'P') spawnPetals(26);
});

/* ---------- 界面自动淡出 ---------- */
let idleTimer = 0;
function wakeUI() {
  document.body.classList.remove('idle');
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => document.body.classList.add('idle'), 9000);
}
document.addEventListener('pointerdown', wakeUI, { passive: true });
wakeUI();

/* ---------- 初始化 ---------- */
$('pcount').textContent = Math.round(pointGeometry.count).toLocaleString('zh-CN');
budGeometry = generateBudGeometry();     // 生成花苞，初始显示（flowerOpacity = 0）
updateStyleUI();
updateThemeUI();
updateHint();

</script>
